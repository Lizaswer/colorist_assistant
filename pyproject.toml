[project]
name = "colorist-assistant"
dynamic = ["version"]
description = "ИИ-ассистент колориста: расчёт и проверка формул окрашивания волос"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[tool.setuptools.dynamic]
version = {attr = "colorist.__version__"}

[tool.setuptools.packages.find]
include = ["colorist*"]

[tool.setuptools.package-data]
"colorist.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
