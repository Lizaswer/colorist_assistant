[project]
name = "colorist-assistant"
version = "0.1.0"
description = "ИИ-ассистент колориста: расчёт и проверка формул окрашивания волос"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["colorist*"]

[tool.setuptools.package-data]
"colorist.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
